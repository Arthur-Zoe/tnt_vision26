# SharedMemoryClassifier参数
CLASSIFIER_SHM_KEY : 0x0250
classifier_model_relative_path : "src/shared_files/models/model_rm2026_openvino/model.xml"

use_RP24_YOLO : true
RP24_YOLO_model_relative_path : "src/shared_files/models/RP24_YOLO/0526.onnx"
RP24_YOLO_device : "GPU"

# ArmorDetect_Node 参数
init_enemy_color : "BLUE" # 初始敌方颜色，连接至电控后会自动获取敌方颜色并覆盖此值
max_armor_position_height : 1500.0 # 最大装甲板高度，超过此值视为无效

camera_ExposureTime : 5000.0  # 5000.0
camera_Gain : 16.0            # 16.0
bullet_velocity_ : 15.0   # 初始弹速，连接至电控后会自动获取实时弹速并覆盖此值
# 相机光心相对枪口的偏移（xyz分别为相机系下向右、向前、向上）
delta_x_ : 50.0   # 待修正
delta_y_ : -50.0  # 待测
delta_z_ : 30.0   # 待修正

pc_ip : "192.168.10.25"
cam_ip : "192.168.10.10"

video_relative_path : "InputVideo/infantry_blue.mp4"    # 使用视频输入时的视频路径
images_relative_path : "InputImages"                    # 使用图片输入时的图片文件夹路径

RMM_visualize_zoom_out_factor : 10.0 # 平面可视化缩放系数，该值越大视野范围越大

# Persistent vehicle target lifecycle. Acquisition policies (Nearest/Middle or
# a concrete armor class) are evaluated only while this state machine is LOST.
target_manager:
  min_detect_frames: 3
  max_temp_lost_frames: 15
  outpost_max_temp_lost_frames: 30
  enable_priority_switch: false

# Single-frame PnP yaw diagnostics/refinement. Refinement changes only the
# orientation used by the EKF; solvePnP translation and xyz remain untouched.
yaw_refinement:
  # Full-video validation found the local reprojection objective weakly
  # observable for yaw, so keep EKF input on raw PnP yaw by default.
  enabled: false
  search_half_range_degree: 5.0
  coarse_step_degree: 0.5
  fine_step_degree: 0.1
  max_accept_delta_degree: 3.0
  min_rmse_improvement_px: 0.05
  min_relative_improvement: 0.02
  debug_csv: false
  debug_csv_path: "/tmp/yaw_measurement_debug.csv"


# Robust 11D EKF for normal four-armor vehicles.
# Internal EKF units are meter / second / radian.
# Robust EKF configuration. Measurement/association/state-machine values below are unchanged.
robust_ekf:
  # Initialization used by the standalone v4 replay that passed the recorded-data test.
  # These are meters. For a different physical robot, replace them with its measured geometry.
  initial_r1: 0.24
  initial_r2: 0.31
  initial_h: 0.09

  # Continuous-time process-noise standard deviations. At 30 FPS the
  # acceleration terms preserve the old velocity noise, while position/yaw
  # random walks restore the old position/yaw diagonal noise.
  process_noise:
    sigma_acc_xy: 3.0           # m/s^2
    sigma_acc_z: 3.0            # m/s^2
    sigma_angular_acc: 2.12132  # rad/s^2
    sigma_pos_rw_xy: 0.054006   # m/sqrt(s)
    sigma_pos_rw_z: 0.054006    # m/sqrt(s)
    sigma_yaw_rw: 0.054391      # rad/sqrt(s)
    sigma_radius_rw: 0.0        # static geometry baseline
    sigma_height_rw: 0.0        # static geometry baseline

  geometry:
    stable_frames_before_update: 5
    reinit_covariance_floor:
      enabled: false
      radius_variance: 0.0005
      height_variance: 0.0005
    debug_csv: false
    debug_csv_path: "/tmp/geometry_debug.csv"
    association_debug_csv: false
    association_debug_csv_path: "/tmp/association_debug.csv"
    lifecycle_debug_csv: false
    lifecycle_debug_csv_path: "/tmp/lifecycle_debug.csv"

  # Measurement covariance terms (variance, not standard deviation).
  r_pos: 0.002
  r_z: 0.002
  r_yaw: 0.002

  state_min_radius: 0.08
  state_max_radius: 0.60
  state_max_abs_h: 0.40
  state_max_abs_w: 20.0

  detect_confirm_frames: 3
  detect_max_misses: 2
  temp_lost_max_frames: 12

  association_nis_gate: 13.28
  association_switch_nis_margin: 1.50
  association_max_position_error: 0.80
  association_max_yaw_error_deg: 65.0

  # 用于旋转相位观测器的参数，
  rotation_phase_observer_enable: true
  rotation_phase_alpha: 0.70
  rotation_phase_max_abs_omega: 15.0
  rotation_phase_max_step_deg: 35.0
  rotation_phase_min_dt: 0.005
  rotation_phase_max_dt: 0.20
  rotation_phase_w_variance: 0.10
  rotation_reversal_min_abs_omega: 0.60
  rotation_reversal_confirm_frames: 2
  rotation_reversal_w_variance: 0.015
  rotation_switch_yaw_r_scale: 9.0

  input_min_range: 0.20
  input_max_range: 8.00
  input_max_abs_z: 2.50
  armor_visible_angle_deg: 70.0


frame_rate : 30.0   # fps
serial_delay_time : 30.0 # ms           电控传来的信息相对相机画面快的时间，将对电控信息再延迟这个时间以同步两者
extra_predict_time : 0.0 # s          除了弹丸飞行时间以外的需要预测器补偿的总时间

pre_predict_time_not_aim : 500.0 # ms 在看到目标的这段时间内不启动自瞄，防止因电控云台角度信息延迟而震荡
pre_predict_time : 2000.0 # ms 在看到目标的这段时间内自瞄直接瞄准当前装甲板位置，不使用预测器预测的位置，待有足够观测值后再使用预测值
reset_predictor_time : 1000.0 # ms 超过这段时间未观测到某一类装甲板，将停止这一类装甲板的预测并重置预测器

# 控制PID参数
pitch_integration_max_degree : 20.0
pitch_integration_min_degree : -20.0
yaw_integration_max_degree : 20.0
yaw_integration_min_degree : -20.0
command_picth_kp: 1.0
command_picth_integration_speed: 0.1
command_picth_integration_max_speed_degree: 5.0     # 积分时超过这个角度的误差会被截断为这个大小进行积分
command_yaw_kp: 1.0
command_yaw_integration_speed: 0.01
command_yaw_integration_max_speed_degree: 5.0

# 火控设置
after_target_change_ceasefire_ms : 300                      # 切换至下一块装甲板后，在这段时间内不开火
before_target_change_ceasefire_ms : 100                     # 切换至下一块装甲板前，在这段时间内提前停火
aim_center_vyaw_upper_threshold : 5.5                       # 敌方小陀螺超过此转速（rad/s）后，切换为瞄准整车中心，预测装甲板到达中心的时间开火
aim_center_vyaw_lower_threshold : 2.0                       # 切换为上述瞄准中心开火模式后，小陀螺转速下降至此值后换回原模式
aim_center_yaw_bias_expand : 0.0                            # 瞄准中心开火模式下，相对于只在装甲板覆盖的角度范围开火，增加此值对应的角度。此值单位为rad
low_vyaw_change_target_delta_yaw_threshold_degree : 30.0    # 角速度较低时，切换目标装甲板需要比当前目标装甲板更靠近的角度，防止在两块装甲板角度相近时目标来回跳变。此值单位为度
low_vyaw_threshold : 0.3                                    # 上述防跳变启用的角速度阈值（rad/s）

choose_armor_yaw_bias_degree : 15.0 # 相对于选择离自身最近的90°(前哨站120°)，提前这个角度切换到下一块装甲板。此值单位为度

